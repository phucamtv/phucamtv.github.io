baseURL = "https://phucam.tv/"
languageCode = "vi"
title = "Phúc Âm"
removePathAccents = true
[pagination]
  pagerSize = 20

[params]
  description = "Phúc Âm TV – Chia sẻ Phúc Âm, lẽ thật Kinh Thánh, tín lý và giáo lý Kinh Thánh, giải thích các lời tiên tri cho người Việt Nam."
  keywords = "Phúc Âm, Kinh Thánh, tín lý, giáo lý, lời tiên tri, Tin Lành, đức tin, Chúa Giê-su, người Việt"

[permalinks]
  [permalinks.page]
    articles = "/:sections/:slug/"
    doctrines = "/tin-ly/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

ignoreFiles = ['\.py$', 'output/']

[taxonomies]
  tag = "tags"
