/* ============================================================
   List builders — return [{key,title,snip,thumb?,meta?,icon?,iconG?}]
   ============================================================ */
function buildList(section, sub) {
  switch (section) {
    case "home":
      return [
        {key:"verse",title:"Câu gốc hôm nay",snip:"“Lời Chúa là ngọn đèn cho chân tôi, ánh sáng cho đường lối tôi.” — Thi-thiên 119:105",icon:Icon.compass,iconG:0,meta:"Mỗi ngày"},
        ...ARTICLES.slice(0,2).map(a=>({key:"a"+a.id,title:a.t,snip:a.ex,thumb:{g:a.g},meta:a.when,_article:a})),
        ...HYMNS.slice(0,2).map(h=>({key:"h"+h.id,title:h.t,snip:h.a+" · "+h.views+" lượt nghe",thumb:{g:h.g,dur:h.dur,play:true},meta:"Thánh ca",_hymn:h})),
      ];
    case "kt": {
      const books = sub==="Cựu Ước" ? OT : NT;
      return books.map(b=>({key:"kt"+b[0],title:b[1],snip:b[2]+" chương · "+(sub||"Tân Ước"),icon:Icon.book,iconG:0,meta:b[0],_book:b}));
    }
    case "tc":
      return HYMNS.map(h=>({key:"h"+h.id,title:h.t,snip:h.a,thumb:{g:h.g,dur:h.dur,play:true},meta:h.views+" lượt nghe",_hymn:h}));
    case "articles":
      return ARTICLES.map(a=>({key:"a"+a.id,title:a.t,snip:a.ex,thumb:{g:a.g,small:true},meta:a.who+" · "+a.when,_article:a}));
    case "authors":
      return AUTHORS.map(a=>({key:"au"+a.id,title:a.name,snip:a.bio,icon:Icon.users,iconG:a.g,meta:a.count+" tác phẩm",_author:a}));
    case "sach":
      return BOOKS.map(b=>({key:"b"+b.id,title:b.t,snip:b.a,thumb:{g:b.g,small:true},meta:b.ch+" chương",_book2:b}));
    case "nghien-cuu":
      return SERIES.map(s=>({key:"s"+s.id,title:s.t,snip:s.ex,thumb:{g:s.g},meta:s.done+"/"+s.parts+" phần",_series:s}));
    default: return [];
  }
}

/* ============================================================
   List item
   ============================================================ */
function ListItem({ it, on, onClick }) {
  const th = it.thumb;
  const body = (
    <div>
      <div className="li-title">
        {it.icon && <span className="dotico" style={{background:gr(it.iconG||0)}}>{it.icon}</span>}
        {it.title}
      </div>
      {it.snip && <div className="li-snip">{it.snip}</div>}
      {it.meta && <div className="li-meta">{Icon.clock}{it.meta}</div>}
    </div>
  );
  return (
    <div className={"li"+(on?" on":"")} onClick={onClick}>
      {th && th.small ? (
        <div className="li-row">
          <div className="li-thumb small" style={{background:gr(th.g)}}>{th.dur && <span className="dur">{th.dur}</span>}</div>
          {body}
        </div>
      ) : (<>
        {body}
        {th && <div className="li-thumb" style={{background:gr(th.g)}}>{th.play && <span className="play">{Icon.play}</span>}{th.dur && <span className="dur">{th.dur}</span>}</div>}
      </>)}
    </div>
  );
}

      <p className="lead">Bài thánh ca ngợi khen tôn vinh Đức Chúa Trời, được trình bày bởi {h.a}. Hãy để giai điệu nâng tâm hồn bạn lên trong sự thờ phượng.</p>
      <h3>Lời bài hát</h3>
      <p>Thánh thay, thánh thay, thánh thay! Chúa toàn năng!<br/>Sớm mai chúng con dâng tiếng ca ngợi khen Ngài.<br/>Thánh thay, thánh thay, thánh thay! Đầy nhân từ và quyền năng,<br/>Đức Chúa Trời ba ngôi, phước hạnh đời đời!</p>
    </div>
  );
}

function ArticleDetail({ a }) {
  return (
    <div className="doc fade">
      <div className="doc-eyebrow">{Icon.pen} {a.cat}</div>
      <div className="doc-title">{a.t}</div>
      <div className="doc-hero" style={{background:gr(a.g)}}>{Icon.pen}</div>
      <div className="doc-stats">{a.who}<span className="dot"/>{a.when}<span className="dot"/>{a.read} đọc</div>
      <p className="lead">{a.ex}</p>
      <p>Trong sự khôn ngoan đời đời của mình, Đức Chúa Trời đã bày tỏ kế hoạch cứu chuộc nhân loại qua Đức Chúa Giê-su Christ. Đây không phải là điều con người có thể đạt được bằng công sức riêng, mà là món quà của ân điển.</p>
      <p>“Vả, ấy là nhờ ân điển, bởi đức tin, mà anh em được cứu, điều đó không phải đến từ anh em, bèn là sự ban cho của Đức Chúa Trời.” Lẽ thật này là nền tảng của đức tin Cơ-đốc.</p>
      <table className="doc-table">
        <thead><tr><th>Thông tin</th><th>Chi tiết</th><th>Tham khảo</th></tr></thead>
        <tbody>
          <tr><td>Chủ đề</td><td>{a.cat}</td><td className="ref">{a.who} ✎</td></tr>
          <tr><td>Thời lượng</td><td>{a.read} đọc</td><td className="ref">Lưu trữ ✎</td></tr>
        </tbody>
      </table>
    </div>
  );
}

function AuthorDetail({ a, onOpen }) {
  return (
    <div className="doc fade">
      <div className="prof">
        <div className="prof-av" style={{background:gr(a.g)}}>{lastWord(a.name)}</div>
        <div>
          <h1>{a.name}</h1>
          <div className="role">{a.role} · {a.count} tác phẩm</div>
        </div>
      </div>
      <p className="lead">{a.bio}</p>
      <h3>Tác phẩm nổi bật</h3>
      <div className="mini-list">
        {ARTICLES.slice(0,3).map(x=>(
          <div className="mini-item" key={x.id} onClick={()=>onOpen&&onOpen(x)}>
            <span className="mini-n">{Icon.pen}</span>
            <div className="sp"><b>{x.t}</b><div><span>{x.cat} · {x.read}</span></div></div>
            {Icon.chev}
          </div>
        ))}
      </div>
    </div>
  );
}

function BookDetail({ b, onPlay }) {
  return (
    <div className="doc fade">
      <div className="doc-eyebrow">{Icon.library} Tủ Sách</div>
      <div className="doc-title"><span className="ti" style={{background:gr(b.g)}}>{Icon.library}</span>{b.t}</div>
      <div className="doc-stats">{b.a}<span className="dot"/>{b.ch} chương</div>
      <div className="doc-actions">
        <button className="pill primary">{Icon.book} Đọc từ đầu</button>
        <button className="pill" onClick={()=>onPlay({id:"bk"+b.id,t:b.t+" — Chương 1",a:b.a+" · Sách nói",g:b.g,dur:"12:30"})}>{Icon.headphones} Nghe sách nói</button>
      </div>
      <p className="lead">Một tác phẩm kinh điển của {b.a}, dẫn dắt người đọc đi sâu vào lẽ thật Kinh Thánh và đời sống thuộc linh.</p>
      <h3>Mục lục</h3>
      <div className="mini-list">
        {["Tình yêu của Đức Chúa Trời","Người tội nhân cần Đấng Christ","Sự ăn năn","Sự xưng tội","Tận hiến"].map((c,i)=>(
          <div className="mini-item" key={i}>
            <span className="mini-n">{i+1}</span>
            <div className="sp"><b>{c}</b></div>
            <span>{6+i} phút</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SeriesDetail({ s }) {
  return (
    <div className="doc fade">
      <div className="doc-eyebrow">{Icon.layers} Loạt Bài Nghiên Cứu</div>
      <div className="doc-title">{s.t}</div>
      <div className="doc-hero" style={{background:gr(s.g)}}>{Icon.layers}</div>
      <div className="doc-stats" style={{flexDirection:"column",alignItems:"stretch",gap:8}}>
        <div className="bar"><i style={{width:Math.round(s.done/s.parts*100)+"%"}}/></div>
        <span style={{fontSize:13,color:"var(--text-3)"}}>{s.done}/{s.parts} phần đã hoàn thành</span>
      </div>
      <p className="lead">{s.ex}</p>
      <h3>Các phần</h3>
      <div className="mini-list">
        {Array.from({length:Math.min(s.parts,6)}).map((_,i)=>(
          <div className="mini-item" key={i}>
            <span className="mini-n" style={i<s.done?{background:"var(--accent)",color:"#fff"}:{}}>{i+1}</span>
            <div className="sp"><b>Phần {i+1}: Bài học {i+1}</b><div><span>{i<s.done?"Đã hoàn thành":"Chưa xem"}</span></div></div>
            {i<s.done ? Icon.play : Icon.chev}
          </div>
        ))}
      </div>
    </div>
  );
}

function HomeVerse() {
  return (
    <div className="doc fade">
      <div className="doc-eyebrow">{Icon.compass} Hôm Nay</div>
      <div className="doc-title" style={{fontSize:30}}>Câu Kinh Thánh trong ngày</div>
      <div className="doc-hero" style={{background:"linear-gradient(120deg,#5a3a18,#2c1d0e)",aspectRatio:"16/7"}}>
        <p style={{fontFamily:"var(--font-display)",fontSize:24,maxWidth:"22ch",textAlign:"center",lineHeight:1.4,color:"#fbf6ec",padding:"0 24px"}}>“Lời Chúa là ngọn đèn cho chân tôi, ánh sáng cho đường lối tôi.”</p>
      </div>
      <div className="doc-stats">Thi-thiên 119:105</div>
      <p className="lead">Hãy bắt đầu ngày mới của bạn trong Lời Chúa. Chọn một sách Kinh Thánh để đọc, hoặc nghe một bài thánh ca từ thư viện.</p>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const [section, setSection] = useState("home");
  const [sub, setSub] = useState("Tân Ước");
  const [ktOpen, setKtOpen] = useState(true);
  const [selKey, setSelKey] = useState("verse");
  const [theme, setTheme] = useState("light");
  const [accent, setAccent] = useState("sage");
  const [railOpen, setRailOpen] = useState(false);
  const [detailOpen, setDetailOpen] = useState(false);
  const [track, setTrack] = useState(null);
  const [playing, setPlaying] = useState(false);
  const [pct, setPct] = useState(26);
  const listRef = useRef(null);

  useEffect(()=>{ document.documentElement.setAttribute("data-theme", theme); }, [theme]);
  useEffect(()=>{
    const A = ACCENTS[accent], p = theme==="dark" ? A.dark : A.light;
    const r = document.documentElement.style;
    r.setProperty("--accent", p.a);
    r.setProperty("--accent-deep", theme==="dark" ? p.d2 : p.d);
    r.setProperty("--terra", p.t);
    r.setProperty("--accent-glow", p.a + (theme==="dark" ? "2b" : "24"));
  }, [accent, theme]);
  useEffect(()=>{ if(!playing) return; const id=setInterval(()=>setPct(p=>p>=100?0:p+0.4),200); return ()=>clearInterval(id); }, [playing]);

  const items = buildList(section, sub);
  const sel = items.find(i=>i.key===selKey) || items[0];

  const goSection = (id, s) => { setSection(id); if(s) setSub(s); const list = buildList(id, s||sub); setSelKey(list[0] ? list[0].key : null); setRailOpen(false); setDetailOpen(false); if(listRef.current) listRef.current.scrollTop=0; };
  const openItem = (k) => { setSelKey(k); setDetailOpen(true); };
  const onPlay = (t) => { setTrack(t); setPlaying(true); setPct(0); };
  const mmss = (frac) => { const tot=252,sc=Math.round(tot*frac/100); return Math.floor(sc/60)+":"+String(sc%60).padStart(2,"0"); };

  const sectionMeta = SECTIONS.find(s=>s.id===section) || SECTIONS[0];
  const listTitle = section==="kt" ? sub : sectionMeta.label;

  /* detail switch */
  let detail = <div className="empty"><div>{Icon.book}<div>Chọn một mục để xem</div></div></div>;
  if (sel) {
    if (sel.key==="verse") detail = <HomeVerse/>;
    else if (sel._article) detail = <ArticleDetail a={sel._article}/>;
    else if (sel._hymn) detail = <HymnDetail h={sel._hymn} onPlay={onPlay}/>;
    else if (sel._book) detail = <ScriptureDetail book={sel._book} onPlay={onPlay}/>;
    else if (sel._author) detail = <AuthorDetail a={sel._author}/>;
    else if (sel._book2) detail = <BookDetail b={sel._book2} onPlay={onPlay}/>;
    else if (sel._series) detail = <SeriesDetail s={sel._series}/>;
  }

  return (
    <div className={"window"+(railOpen?" rail-open":"")+(detailOpen?" detail-open":"")}>
      <div className="backdrop" onClick={()=>setRailOpen(false)}/>
      {/* RAIL */}
      <nav className="rail">
        <div className="rail-brand">
          <div className="rail-mark">{Icon.book}</div>
          <div><span>Thư Viện</span><b>Phúc Âm</b></div>
        </div>
        {SECTIONS.map(s => (
          <React.Fragment key={s.id}>
            <button className={"rail-item"+(section===s.id?" on":"")}
              onClick={()=>{ if(s.group){ setKtOpen(o=>!o); goSection(s.id, sub);} else goSection(s.id); }}>
              {s.icon}{s.label}
              {s.group && <span className={"chev"+(ktOpen?" open":"")}>{Icon.chev}</span>}
            </button>
            {s.group && ktOpen && (
              <div className="rail-sub">
                {s.group.map(g=>(
                  <button key={g} className={"rail-item"+(section==="kt"&&sub===g?" on":"")} onClick={()=>goSection("kt", g)}>{g}</button>
                ))}
              </div>
            )}
          </React.Fragment>
        ))}
        <div className="rail-foot">
          <div className="rail-label">Màu nhấn · {ACCENTS[accent].name}</div>
          <div className="accent-row">
            {ACCENT_KEYS.map(k => (
              <button key={k} className={"swatch"+(accent===k?" on":"")} title={ACCENTS[k].name}
                style={{background:ACCENTS[k].light.a}} onClick={()=>setAccent(k)} aria-label={ACCENTS[k].name} />
            ))}
          </div>
          <div className="rail-label">Bộ sưu tập</div>
          <button className="rail-item">{Icon.heart}Yêu thích</button>
          <button className="rail-item">{Icon.bookmark}Đánh dấu</button>
          <button className="rail-toggle" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}>
            {theme==="light"?Icon.moon:Icon.sun}{theme==="light"?"Chế độ tối":"Chế độ sáng"}
          </button>
        </div>
      </nav>

      {/* LIST */}
      <section className="list">
        <div className="list-head">
          <button className="m-trigger" onClick={()=>setRailOpen(true)} aria-label="Mở thư viện">
            <span className="m-mark">{Icon.book}</span>
          </button>
          <h2>{listTitle} {Icon.chev}</h2>
          <span className="sp"/>
          <button className="list-ico">{Icon.edit}</button>
          <button className="list-ico">{Icon.search}</button>
        </div>
        <div className="list-body stagger" ref={listRef}>
          {items.map(it => <ListItem key={it.key} it={it} on={sel && it.key===sel.key} onClick={()=>openItem(it.key)} />)}
        </div>
      </section>

      {/* DETAIL */}
      <section className="detail">
        <div className="detail-head">
          <button className="m-back" onClick={()=>setDetailOpen(false)} aria-label="Trở lại">{Icon.chevL}<span>{listTitle}</span></button>
          <span className="crumb">{sectionMeta.label}{section==="kt"?" › "+sub:""}</span>
          <span className="sp"/>
          <button className="tool aa">A<span style={{fontSize:17}}>A</span></button>
          <button className="tool">{Icon.info}</button>
          <button className="tool">{Icon.more}</button>
        </div>
        <div className="doc-scroll">{detail}</div>
        <div className="doc-toolbar">
          <button>{Icon.headphones}</button>
          <button>{Icon.bookmark}</button>
          <button>{Icon.heart}</button>
          <span className="div"/>
          <button>{Icon.list}</button>
          <button>{Icon.table}</button>
          <button>{Icon.link}</button>
          <button>{Icon.share}</button>
        </div>
      </section>

      {/* NOW PLAYING */}
      {track && (
        <footer className="np">
          <div className="np-info">
            <div className="np-art" style={{background:gr(track.g||0)}}>{playing?<span className="eq"><i/><i/><i/><i/></span>:Icon.music}</div>
            <div className="np-text"><b>{track.t}</b><span>{track.a}</span></div>
            <button style={{color:"var(--text-2)"}}>{Icon.heart}</button>
          </div>
          <div className="np-center">
            <div className="np-ctrl">
              <button>{Icon.shuffle}</button>
              <button>{Icon.prev}</button>
              <button className="np-play" onClick={()=>setPlaying(p=>!p)}>{playing?Icon.pause:Icon.play}</button>
              <button>{Icon.next}</button>
              <button>{Icon.repeat}</button>
            </div>
            <div className="np-prog">
              <span className="t">{mmss(pct)}</span>
              <div className="np-track" onClick={(e)=>{const r=e.currentTarget.getBoundingClientRect();setPct((e.clientX-r.left)/r.width*100);}}><i style={{width:pct+"%"}}/></div>
              <span className="t">{track.dur||"4:12"}</span>
            </div>
          </div>
          <div className="np-right">{Icon.volume}<div className="np-vol"><i/></div></div>
        </footer>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
