/* ============================================================
   Reusable bits
   ============================================================ */
function Tile({ i, num, dur, square }) {
  return (
    <div className={"tile" + (square ? " sq" : "")} style={{ background: gr(i) }}>
      {num != null && <span className="tile-num">{num}</span>}
      {dur && <span className="dur">{dur}</span>}
      <span className="play">{Icon.play}</span>
    </div>
  );
}

function HymnCard({ h, onPlay }) {
  return (
    <div className="card" onClick={() => onPlay(h)}>
      <Tile i={h.g} dur={h.dur} />
      <div className="card-body">
        <div className="card-title">{h.t}</div>
        <div className="card-meta">{h.a}<span className="dot"/>{h.views} lượt nghe</div>
      </div>
    </div>
  );
}

function Shelf({ title, children, onMore }) {
  return (
    <section className="shelf">
      <div className="shelf-head">
        <h2>{title}</h2>
        {onMore && <a onClick={onMore}>Xem tất cả {Icon.fwd}</a>}
      </div>
      {children}
    </section>
  );
}

/* ============================================================
   Pages
   ============================================================ */
function Home({ go, onPlay }) {
  return (
    <div className="page fade-up">
      <section className="hero">
        <div className="eyebrow">Câu Kinh Thánh Hôm Nay</div>
        <h1>Lời Chúa là ngọn đèn cho chân tôi.</h1>
        <p>“Lời Chúa là ngọn đèn cho chân tôi, ánh sáng cho đường lối tôi.” — Thi-thiên 119:105. Đọc, nghe, và suy ngẫm mỗi ngày trong thư viện thiêng liêng.</p>
        <div className="hero-actions">
          <button className="btn btn-primary" onClick={() => go({s:"kt"})}>{Icon.book} Đọc Kinh Thánh</button>
          <button className="btn btn-ghost" onClick={() => onPlay(HYMNS[0])}>{Icon.play} Nghe Thánh Ca</button>
        </div>
      </section>

      <Shelf title="Tiếp tục nghe" onMore={() => go({s:"tc"})}>
        <div className="row stagger">
          {HYMNS.slice(0,6).map(h => <HymnCard key={h.id} h={h} onPlay={onPlay} />)}
        </div>
      </Shelf>

      <Shelf title="Bài viết mới" onMore={() => go({s:"articles"})}>
        <div className="row stagger">
          {ARTICLES.map(a => (
            <div className="card" key={a.id} onClick={() => go({s:"articles"})}>
              <Tile i={a.g} />
              <div className="card-body">
                <div className="card-meta" style={{marginBottom:6, marginTop:0, color:"var(--accent-deep)", fontWeight:600}}>{a.cat}</div>
                <div className="card-title">{a.t}</div>
                <div className="card-meta">{a.read}</div>
              </div>
            </div>
          ))}
        </div>
      </Shelf>

      <Shelf title="Loạt bài nghiên cứu" onMore={() => go({s:"nghien-cuu"})}>
        <div className="row stagger">
          {SERIES.map(s => (
            <div className="card" key={s.id} style={{gridColumn:"span 1", gridAutoColumns:"260px"}} onClick={() => go({s:"nghien-cuu"})}>
              <div className="tile" style={{background:gr(s.g), aspectRatio:"16/9"}}>
                <span style={{position:"absolute", top:12, right:14, opacity:.85}}>{Icon.layers}</span>
                <span className="tile-num" style={{fontSize:22, fontWeight:600, padding:"0 16px", textAlign:"center"}}>{s.t}</span>
              </div>
              <div className="card-body">
                <div className="card-meta">{s.parts} phần · {s.done} đã xem</div>
              </div>
            </div>
          ))}
        </div>
      </Shelf>
    </div>
  );
}

function KinhThanh({ go, openBook }) {

  const books = tab === "ot" ? OT : NT;
  return (
    <div className="page fade-up">
      <div className="page-head">
        <div className="eyebrow">{Icon.headphones} Đọc &amp; Nghe</div>
        <h1 className="page-title">Kinh Thánh</h1>
        <p className="page-sub">66 sách trong một thư viện. Chạm để đọc, nhấn “Nghe” để theo dõi bằng âm thanh.</p>
      </div>
      <div className="segmented" style={{marginBottom:22}}>
        <button className={tab==="ot"?"on":""} onClick={()=>setTab("ot")}>Cựu Ước</button>
        <button className={tab==="nt"?"on":""} onClick={()=>setTab("nt")}>Tân Ước</button>
      </div>
      <div className="kt-grid stagger">
        {books.map((b,i) => (
          <div className="kt-book" key={b[0]} onClick={() => openBook(b)}>

            <div className="ch">{b[2]} chương</div>

}

    <div className="page page-wide fade-up">
      <div className="watch">
        <div>
          <div className="player-stage" style={{background:gr(hymn.g)}}>
            <button className="big-play" onClick={() => onPlay(hymn)}>{Icon.play}</button>
          </div>
          <h1 className="watch-title">{hymn.t}</h1>
          <div className="watch-stats">{hymn.views} lượt nghe<span className="dot"/>{hymn.a}</div>
          <div className="watch-actions">
            <button className="pill" onClick={() => onPlay(hymn)}>{Icon.play} Phát</button>
            <button className="pill">{Icon.heart} Thích</button>
            <button className="pill">{Icon.plus} Lưu</button>

          </div>
          <div className="watch-desc">

          </div>
        </div>
        <aside>
          <div className="queue-title">Tiếp theo trong danh sách</div>
          {related.map(h => (
            <div className={"q-item" + (h.id===nowId?" on":"")} key={h.id} onClick={() => openHymn(h)}>

}

    <div className="page fade-up">
      <div className="page-head">
        <div className="eyebrow">{Icon.pen} Suy Ngẫm &amp; Lẽ Thật</div>
        <h1 className="page-title">Bài Viết</h1>
        <p className="page-sub">Những bài giảng, suy ngẫm và nghiên cứu Lời Chúa được tuyển chọn.</p>
      </div>
      <div className="feed stagger">
        {ARTICLES.map(a => (
          <article className="article" key={a.id}>
            <div className="article-img" style={{background:gr(a.g)}}>{Icon.pen}</div>
            <div className="article-body">
              <span className="article-cat">{a.cat}</span>
              <h3>{a.t}</h3>
              <p>{a.ex}</p>
              <div className="article-foot">
                <span className="mini-av" style={{background:gr((a.id+2))}}>{a.who.split(" ").slice(-1)[0][0]}</span>
                <span className="who">{a.who}</span>
                <span className="when">· {a.when} · {a.read}</span>
              </div>
            </div>
          </article>
        ))}
      </div>
    </div>
  );
}

function TacGia({ go }) {
  return (
    <div className="page fade-up">
      <div className="page-head">
        <div className="eyebrow">{Icon.users} Thư Viện Tác Giả</div>
        <h1 className="page-title">Tác Giả</h1>
        <p className="page-sub">Khám phá các tác giả, mục sư và nhà nghiên cứu cùng tác phẩm của họ.</p>
      </div>
      <div className="author-grid stagger">
        {AUTHORS.map(a => (
          <div className="author-card" key={a.id}>
            <div className="author-av" style={{background:gr(a.g)}}>{a.name.split(" ").slice(-1)[0][0]}</div>
            <h3>{a.name}</h3>
            <div className="role">{a.role}</div>
            <div className="count">{a.count}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TuSach({ go }) {
  return (
    <div className="page fade-up">
      <div className="page-head">
        <div className="eyebrow">{Icon.library} Tủ Sách</div>
        <h1 className="page-title">Sách</h1>
        <p className="page-sub">Tủ sách thiêng liêng — chạm vào gáy sách để mở đọc từng chương.</p>
      </div>
      <div className="shelf-grid stagger">
        {BOOKS.map(b => (
          <div className="book" key={b.id}>
            <div className="book-cover" style={{background:gr(b.g)}}>
              <div className="bt">{b.t}</div>
              <div className="ba">{b.a}</div>
            </div>
            <div className="book-info">
              <b>{b.t}</b>
              <span>{b.a}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function NghienCuu({ go }) {
  return (
    <div className="page fade-up">
      <div className="page-head">
        <div className="eyebrow">{Icon.layers} Nghiên Cứu Chuyên Sâu</div>
        <h1 className="page-title">Loạt Bài Nghiên Cứu</h1>
        <p className="page-sub">Những loạt bài nhiều phần — học có hệ thống như một khoá học, theo dõi tiến độ của bạn.</p>
      </div>
      <div className="series-grid stagger">
        {SERIES.map(s => (
          <div className="series" key={s.id}>
            <div className="series-cover" style={{background:gr(s.g)}}>
              <span className="sc-icon">{Icon.layers}</span>
              <h3>{s.t}</h3>
            </div>
            <div className="series-body">
              <p>{s.ex}</p>
              <div className="series-prog">
                <div className="bar"><i style={{width: Math.round(s.done/s.parts*100)+"%"}}/></div>
                <span>{s.done}/{s.parts} phần</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>

/* ============================================================
   Now Playing bar
   ============================================================ */
function NowPlaying({ track, playing, setPlaying }) {
  const [pct, setPct] = useState(28);
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setPct(p => (p >= 100 ? 0 : p + 0.4)), 200);
    return () => clearInterval(id);
  }, [playing]);
  const mmss = (frac) => {
    const total = 252; const s = Math.round(total * frac/100);
    return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  };
  return (
    <footer className="nowplaying">
      <div className="np-info">
        <div className="np-art" style={{background:gr(track.g||0)}}>
          {playing ? <span className="eq"><i/><i/><i/><i/></span> : Icon.music}
        </div>
        <div className="np-text">
          <b>{track.t}</b>
          <span>{track.a}</span>
        </div>
        <button className="icon-btn">{Icon.heart}</button>
      </div>
      <div className="np-center">
        <div className="np-controls">
          <button className="icon-btn">{Icon.shuffle}</button>
          <button className="icon-btn">{Icon.prev}</button>
          <button className="np-play" onClick={() => setPlaying(p => !p)}>{playing ? Icon.pause : Icon.play}</button>
          <button className="icon-btn">{Icon.next}</button>
          <button className="icon-btn">{Icon.repeat}</button>
        </div>
        <div className="np-progress">
          <span className="t">{mmss(pct)}</span>
          <div className="np-track" onClick={(e)=>{const r=e.currentTarget.getBoundingClientRect();setPct((e.clientX-r.left)/r.width*100);}}>
            <i style={{width: pct+"%"}}/>
          </div>
          <span className="t">{track.dur||"4:12"}</span>
        </div>
      </div>
      <div className="np-right">
        <button className="icon-btn">{Icon.headphones}</button>
        <div className="vol">{Icon.volume}<div className="vol-track"><i/></div></div>
      </div>
    </footer>
  );
}

/* ============================================================
   App shell
   ============================================================ */
const NAV = [
  { id:"home", label:"Khám Phá", icon:Icon.compass },
  { id:"kt", label:"Kinh Thánh", icon:Icon.book },
  { id:"tc", label:"Thánh Ca", icon:Icon.music, badge:"Mới" },
  { id:"articles", label:"Bài Viết", icon:Icon.pen },
  { id:"authors", label:"Tác Giả", icon:Icon.users },
  { id:"sach", label:"Tủ Sách", icon:Icon.library },
  { id:"nghien-cuu", label:"Nghiên Cứu", icon:Icon.layers },
];

function App() {
  const [route, setRoute] = useState({ s:"home" });
  const [hist, setHist] = useState([]);
  const [theme, setTheme] = useState("light");
  const [track, setTrack] = useState(null);
  const [playing, setPlaying] = useState(false);
  const mainRef = useRef(null);

  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [route]);

  const go = (r) => { setHist(h => [...h, route]); setRoute(r); };
  const back = () => setHist(h => { if (!h.length) return h; setRoute(h[h.length-1]); return h.slice(0,-1); });

  const onPlay = (t) => { setTrack(t); setPlaying(true); };
  const openHymn = (h) => { go({ s:"tc", watch:h }); setTrack(h); };

  const sec = route.s;
  let view;
  if (sec === "home") view = <Home go={go} onPlay={onPlay} />;
  else if (sec === "kt") view = route.book
        ? <Reader book={route.book} back={back} onPlay={onPlay} />
        : <KinhThanh openBook={(b)=>go({s:"kt", book:b})} />;
  else if (sec === "tc") view = route.watch
        ? <Watch hymn={route.watch} onPlay={onPlay} openHymn={openHymn} nowId={track && track.id} />
        : <ThanhCa openHymn={openHymn} />;
  else if (sec === "articles") view = <BaiViet go={go} />;
  else if (sec === "authors") view = <TacGia go={go} />;
  else if (sec === "sach") view = <TuSach go={go} />;
  else if (sec === "nghien-cuu") view = <NghienCuu go={go} />;

  return (
    <div className="app">
      <nav className="sidebar">
        <div className="brand">
          <div className="brand-mark">{Icon.book}</div>
          <div>
            <div className="brand-name">Phúc Âm</div>
            <div className="brand-sub">Thư Viện</div>
          </div>
        </div>
        <div className="nav-group">
          <div className="nav-label">Thư Viện Thiêng Liêng</div>
          {NAV.map(n => (
            <button key={n.id} className={"nav-item" + (sec===n.id?" active":"")} onClick={() => go({s:n.id})}>
              {n.icon}{n.label}
              {n.badge && <span className="badge">{n.badge}</span>}
            </button>
          ))}
        </div>
        <div className="sidebar-foot">
          <div className="recent-title">Nghe gần đây</div>
          {HYMNS.slice(0,3).map(h => (
            <div className="recent" key={h.id} onClick={() => openHymn(h)}>
              <div className="recent-thumb" style={{background:gr(h.g)}}/>
              <div className="recent-meta">
                <b>{h.t}</b>
                <span>{h.a}</span>
              </div>
            </div>
          ))}
        </div>
      </nav>

      <header className="topbar">
        <div className="nav-arrows">
          <button className="icon-btn" onClick={back} disabled={!hist.length} style={{opacity: hist.length?1:.4}}>{Icon.back}</button>
          <button className="icon-btn" style={{opacity:.4}}>{Icon.fwd}</button>
        </div>
        <div className="search">
          {Icon.search}
          <input placeholder="Tìm câu Kinh Thánh, thánh ca, tác giả…" />
        </div>
        <div className="topbar-spacer" />
        <button className="theme-toggle" onClick={() => setTheme(t => t==="light"?"dark":"light")}>
          {theme==="light" ? Icon.moon : Icon.sun}
          {theme==="light" ? "Tối" : "Sáng"}
        </button>
        <button className="avatar-btn">PÂ</button>
      </header>

      <main className="main" ref={mainRef}>
        {view}
      </main>

      {track && <NowPlaying track={track} playing={playing} setPlaying={setPlaying} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
