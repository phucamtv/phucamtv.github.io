{{- /* Mobile rail/list drawer wiring + middle-column scroll. Shared. */ -}}
<script>
(function () {
  var app = document.querySelector(".lib-app");
  if (!app) return;

  /* ---- mobile drawers (rail = col 1, mid = col 2) ---- */
  var open = function () { app.classList.add("rail-open"); };
  var openMid = function () { app.classList.add("mid-open"); };
  var close = function () { app.classList.remove("rail-open"); app.classList.remove("mid-open"); };
  /* peel the top-most open drawer: rail first (so a click outside the rail closes
     just the rail and reveals col 2), then the mid */
  var closeTop = function () {
    if (app.classList.contains("rail-open")) app.classList.remove("rail-open");
    else if (app.classList.contains("mid-open")) app.classList.remove("mid-open");
  };
  document.querySelectorAll(".lib-mtrigger, .lib-rtrigger").forEach(function (b) { b.addEventListener("click", open); });
  document.querySelectorAll(".lib-dtrigger").forEach(function (b) { b.addEventListener("click", openMid); });
  var bd = app.querySelector(".lib-app-backdrop");
  if (bd) bd.addEventListener("click", closeTop);
  app.querySelectorAll(".lib-rail a, .lib-mid a").forEach(function (a) { a.addEventListener("click", close); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

  /* ---- touch: swipe in from the right edge to open col 2; swipe right to close the top drawer ---- */
  var sx = 0, sy = 0, fromR = false;
  document.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    fromR = !app.classList.contains("mid-open") && !app.classList.contains("rail-open")
            && sx >= window.innerWidth - 28;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    var t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
    if (fromR && dx < 0) { openMid(); fromR = false; }
    else if (dx > 0) { closeTop(); }
  }, { passive: true });

  /* ---- middle column: scroll the active book/chapter into view ---- */
  var midBody = document.querySelector(".lib-mid-body");
  var openBook = midBody && midBody.querySelector(".lib-book[open]");
  if (openBook) {
    var target = openBook.querySelector(".lib-chapcell.is-current")
      || openBook.querySelector(".lib-book-sum") || openBook;
    var br = midBody.getBoundingClientRect(), tr = target.getBoundingClientRect();
    midBody.scrollTop += (tr.top - br.top) - (midBody.clientHeight - tr.height) / 2;
  }
})();
(function () {
  var app = document.querySelector(".lib-app");
  if (!app) return;

  /* ---- Kinh Thánh parent: unfold children inline on click ---- */
  app.querySelectorAll(".lib-navbar [data-toggle]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      btn.closest("[data-parent]").classList.toggle("open");
    });
  });
  document.addEventListener("click", function () {
    app.querySelectorAll(".lib-navbar-parent.open").forEach(function (p) { p.classList.remove("open"); });
  });
})();
</script>
