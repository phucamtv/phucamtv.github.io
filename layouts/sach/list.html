{{ define "main" }}
<section class="list" style="max-width:800px">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ $pages := .RegularPages.ByWeight }}
  {{ range $pages }}
  <article class="summary">
    <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
  </article>
  {{ end }}
</section>
{{ end }}
