<!DOCTYPE html>
<html lang="vi">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="lib-app-body">
  {{- $reader := in (slice "nc-series" "nc-episode") .Layout -}}
  <div class="lib-app{{ if $reader }} detail-open{{ else }} no-mid{{ end }}">
    <div class="lib-app-backdrop"></div>
    {{- partial "lib/rail.html" (dict "active" "nghien-cuu") -}}
    {{- if $reader }}{{- partial "nghien-cuu/list.html" . -}}{{- end }}
    <main class="lib-detail">
      <div class="lib-detail-scroll">
        {{- block "main" . }}{{- end }}
      </div>
    </main>
  </div>
  {{- partial "lib/app-js.html" . -}}
</body>
</html>
