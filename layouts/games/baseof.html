<!DOCTYPE html>
<html lang="vi">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="lib-app-body">
  {{- $index := eq .Kind "section" -}}
  <div class="lib-app{{ if $index }} no-mid{{ else }} detail-open{{ end }}">
    <div class="lib-app-backdrop"></div>
    {{- partial "lib/rail.html" (dict "active" "games") -}}
    {{- if not $index }}{{- partial "games/list.html" . -}}{{- end }}
    <main class="lib-detail{{ if not $index }} lib-detail--has-bankinfo{{ end }}">
      <div class="lib-detail-scroll">
        {{- block "main" . }}{{- end }}
      </div>
      {{- block "bankinfo" . }}{{- end }}
    </main>
  </div>
  {{- partial "lib/app-js.html" . -}}
</body>
</html>
