{{ define "main" }}
<button class="lib-dtrigger" type="button" aria-label="Mở danh sách trò chơi">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
</button>
<div class="games">
  <h1>{{ .Title }}</h1>
  <div id="difficulty" class="difficulty"></div>
  <div id="game"></div>
</div>

{{ $data := index hugo.Data.games .Params.data }}
<script>window.GAME_DATA = {{ $data | jsonify | safeJS }};</script>
<script type="module">
  import { init } from '/games/js/games/{{ .Params.game }}.js';
  import { createDifficultySelector } from '/games/js/shared/difficulty.js';

  const mount = document.getElementById('game');
  let cleanup = null;

  function run(level) {
    if (cleanup) cleanup();
    try {
      cleanup = init(mount, level);
    } catch (e) {
      cleanup = null;
      mount.textContent = 'Không tải được trò chơi.';
      console.error(e);
    }
  }

  // createDifficultySelector calls onChange('normal') immediately,
  // so the game boots at Normal on load.
  createDifficultySelector(document.getElementById('difficulty'), run);
</script>
{{ end }}
