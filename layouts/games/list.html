{{ define "main" }}
<div class="games">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
  <ul class="games-hub">
    {{ range .Pages }}
    <li>
      <a class="games-card" href="{{ .RelPermalink }}">
        <h2>{{ .Title }}</h2>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
